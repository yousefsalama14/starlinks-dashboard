<div class="formly-password-field">
  <iconsax-icon
    class="formly-password-field__icon"
    name="lock"
    type="linear"
    size="20"
    aria-hidden="true"
  ></iconsax-icon>
  <input
    pInputText
    class="formly-password-field__input"
    [type]="isVisible() ? 'text' : 'password'"
    [formControl]="formControl"
    [formlyAttributes]="field"
    [placeholder]="props.placeholder ?? ''"
    [invalid]="showError"
  />
  <button
    type="button"
    class="formly-password-field__toggle"
    [attr.aria-label]="
      (isVisible() ? 'STARLINKS.COMMON.HIDE_PASSWORD' : 'STARLINKS.COMMON.SHOW_PASSWORD')
        | translate
    "
    [attr.aria-pressed]="isVisible()"
    [disabled]="formControl.disabled"
    (click)="toggleVisibility()"
  >
    <iconsax-icon
      [attr.name]="isVisible() ? 'eye-slash' : 'eye'"
      type="linear"
      size="20"
      aria-hidden="true"
    ></iconsax-icon>
  </button>
</div>
