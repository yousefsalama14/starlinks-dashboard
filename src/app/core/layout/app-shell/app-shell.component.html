<div class="min-h-screen bg-starlinks-bg text-starlinks-text lg:pl-[var(--starlinks-menu-rail-width)]">
  <aside class="side-menu-rail hidden flex-col lg:flex">
    <a routerLink="/app/home" class="side-menu__logo" [attr.aria-label]="'STARLINKS.BRAND.NAME' | translate"></a>
    <div class="side-menu__divider"></div>
    <app-navigation-menu
      [items]="navItems"
      [attr.aria-label]="'STARLINKS.APP_SHELL.MAIN_NAVIGATION' | translate"
    />
    <div class="mt-auto">
      <div class="side-menu__divider"></div>
      <app-navigation-menu [items]="logoutItems" (itemSelected)="handleMenuItemSelection()" />
    </div>
  </aside>

  <div class="min-w-0">
    <header
      class="sticky top-0 z-30 flex items-center justify-between border-b border-starlinks-border bg-starlinks-surface/95 px-4 py-3 backdrop-blur lg:hidden"
    >
      <button
        type="button"
        class="flex size-10 items-center justify-center rounded-xl text-starlinks-text transition hover:bg-starlinks-surfaceMuted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-starlinks-accent"
        [attr.aria-label]="'STARLINKS.APP_SHELL.OPEN_MENU' | translate"
        [attr.aria-expanded]="isMobileMenuOpen()"
        (click)="openMobileMenu()"
      >
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>
      <a routerLink="/app/home" class="font-display text-lg font-bold text-starlinks-text">
        {{ 'STARLINKS.BRAND.NAME' | translate }}
      </a>
      <app-language-switcher />
    </header>

    @if (isMobileMenuOpen()) {
      <div class="fixed inset-0 z-50 lg:hidden" (keydown.escape)="closeMobileMenu()">
        <button
          type="button"
          class="absolute inset-0 cursor-default bg-starlinks-ink/45"
          [attr.aria-label]="'STARLINKS.APP_SHELL.CLOSE_MENU' | translate"
          (click)="closeMobileMenu()"
        ></button>
        <aside
          class="relative flex h-full w-72 flex-col bg-starlinks-surface p-6 shadow-2xl"
          role="dialog"
          aria-modal="true"
          [attr.aria-label]="'STARLINKS.APP_SHELL.MAIN_NAVIGATION' | translate"
        >
          <div class="flex items-center justify-between">
            <span class="side-menu__logo m-0"></span>
            <button
              type="button"
              class="flex size-10 items-center justify-center rounded-xl text-starlinks-text hover:bg-starlinks-surfaceMuted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-starlinks-accent"
              [attr.aria-label]="'STARLINKS.APP_SHELL.CLOSE_MENU' | translate"
              (click)="closeMobileMenu()"
            >
              <i class="pi pi-times" aria-hidden="true"></i>
            </button>
          </div>
          <div class="side-menu__divider"></div>
          <app-navigation-menu [items]="navItems" [expanded]="true" (itemSelected)="handleMenuItemSelection()" />
          <div class="mt-auto">
            <div class="side-menu__divider"></div>
            <app-navigation-menu [items]="logoutItems" [expanded]="true" (itemSelected)="handleMenuItemSelection()" />
          </div>
        </aside>
      </div>
    }

    <main class="mx-auto w-full max-w-6xl px-4 py-6 md:px-8 lg:px-10 lg:py-10">
      <router-outlet />
    </main>
  </div>
</div>
