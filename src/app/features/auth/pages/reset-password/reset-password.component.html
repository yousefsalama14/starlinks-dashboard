<app-auth-layout>
  <h1 class="auth-page__title font-display">
    {{ 'STARLINKS.AUTH.RESET_PASSWORD.TITLE' | translate }}
  </h1>
  <p class="auth-page__subtitle">{{ 'STARLINKS.AUTH.RESET_PASSWORD.SUBTITLE' | translate }}</p>

  <form class="auth-page__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <formly-form [form]="form" [fields]="fields" [model]="formModel"></formly-form>

    <app-password-requirements [password]="newPasswordValue()" />

    <button
      type="submit"
      class="btn-primary"
      [disabled]="isSubmitting() || tokenError() !== null"
      [attr.aria-busy]="isSubmitting()"
    >
      @if (isSubmitting()) {
        {{ 'STARLINKS.AUTH.RESET_PASSWORD.SUBMITTING' | translate }}
      } @else {
        {{ 'STARLINKS.AUTH.RESET_PASSWORD.SUBMIT' | translate }}
      }
    </button>

    <p class="auth-page__row auth-page__row--center">
      <a routerLink="/auth/login" class="auth-page__link">
        {{ 'STARLINKS.AUTH.RESET_PASSWORD.BACK_TO_LOGIN' | translate }}
      </a>
    </p>
  </form>

  <div authLayoutFooter>
    <app-auth-footer />
  </div>
</app-auth-layout>

<app-auth-feedback-dialog
  [visible]="showSuccessDialog()"
  variant="success"
  titleKey="STARLINKS.AUTH.RESET_PASSWORD.SUCCESS_TITLE"
  messageKey="STARLINKS.AUTH.RESET_PASSWORD.SUCCESS_MESSAGE"
  actionLabelKey="STARLINKS.COMMON.CONTINUE"
  (action)="onSuccessConfirmed()"
/>

<app-auth-feedback-dialog
  [visible]="tokenError() !== null"
  variant="error"
  [titleKey]="
    tokenError() === 'expired'
      ? 'STARLINKS.AUTH.RESET_PASSWORD.EXPIRED_TOKEN_TITLE'
      : 'STARLINKS.AUTH.RESET_PASSWORD.INVALID_TOKEN_TITLE'
  "
  [messageKey]="
    tokenError() === 'expired'
      ? 'STARLINKS.AUTH.RESET_PASSWORD.EXPIRED_TOKEN_MESSAGE'
      : 'STARLINKS.AUTH.RESET_PASSWORD.INVALID_TOKEN_MESSAGE'
  "
  actionLabelKey="STARLINKS.AUTH.RESET_PASSWORD.REQUEST_NEW_LINK"
  (action)="goToForgotPassword()"
/>
