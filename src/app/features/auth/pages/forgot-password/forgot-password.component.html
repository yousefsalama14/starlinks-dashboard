<app-auth-layout>
  <button
    type="button"
    class="auth-page__back"
    authLayoutBack
    [attr.aria-label]="'STARLINKS.COMMON.BACK' | translate"
    (click)="onBack()"
  >
    <iconsax-icon
      class="auth-page__back-icon"
      name="arrow-left-01"
      type="linear"
      size="18"
      aria-hidden="true"
    ></iconsax-icon>
  </button>

  <h1 class="auth-page__title font-display">
    {{ 'STARLINKS.AUTH.FORGOT_PASSWORD.TITLE' | translate }}
  </h1>
  <p class="auth-page__subtitle">{{ 'STARLINKS.AUTH.FORGOT_PASSWORD.SUBTITLE' | translate }}</p>

  <form class="auth-page__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <formly-form [form]="form" [fields]="fields" [model]="formModel"></formly-form>

    <button
      type="submit"
      class="btn-primary"
      [disabled]="isSubmitting()"
      [attr.aria-busy]="isSubmitting()"
    >
      @if (isSubmitting()) {
        {{ 'STARLINKS.AUTH.FORGOT_PASSWORD.SUBMITTING' | translate }}
      } @else {
        {{ 'STARLINKS.AUTH.FORGOT_PASSWORD.SUBMIT' | translate }}
      }
    </button>

    <p class="auth-page__row auth-page__row--center">
      <span>{{ 'STARLINKS.AUTH.FORGOT_PASSWORD.REMEMBERED_PASSWORD' | translate }}</span>
      <a routerLink="/auth/login" class="auth-page__link">{{
        'STARLINKS.AUTH.FORGOT_PASSWORD.SIGN_IN' | translate
      }}</a>
    </p>
  </form>

  <div authLayoutFooter>
    <app-auth-footer />
  </div>
</app-auth-layout>

<app-auth-feedback-dialog
  [visible]="showFeedbackDialog()"
  [variant]="feedbackVariant()"
  [titleKey]="
    feedbackVariant() === 'success'
      ? 'STARLINKS.AUTH.FORGOT_PASSWORD.SUCCESS_TITLE'
      : 'STARLINKS.COMMON.GENERIC_ERROR_TITLE'
  "
  [messageKey]="
    feedbackVariant() === 'success'
      ? 'STARLINKS.AUTH.FORGOT_PASSWORD.SUCCESS_MESSAGE'
      : 'STARLINKS.COMMON.GENERIC_ERROR_MESSAGE'
  "
  actionLabelKey="STARLINKS.COMMON.CONFIRM"
  (action)="onFeedbackDialogClosed()"
  (closed)="onFeedbackDialogClosed()"
/>
