<section class="space-y-6">
  <nav
    class="flex items-center gap-2 text-sm text-starlinks-textMuted"
    [attr.aria-label]="'STARLINKS.ACTIVITY.BREADCRUMB_LABEL' | translate"
  >
    <a
      routerLink="/app/dashboard"
      class="inline-flex items-center gap-2 rounded-lg transition hover:text-starlinks-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-starlinks-accent"
    >
      <i class="pi pi-home text-xs" aria-hidden="true"></i>
      <span>{{ 'STARLINKS.NAV.DASHBOARD' | translate }}</span>
    </a>
    <i class="pi pi-angle-right text-xs" aria-hidden="true"></i>
    <span class="font-semibold text-starlinks-text" aria-current="page">{{
      'STARLINKS.NAV.ACTIVITY' | translate
    }}</span>
  </nav>

  <article
    class="rounded-[2rem] border border-dashed border-starlinks-border bg-starlinks-surface p-8 text-center shadow-sm md:p-12"
  >
    <span
      class="mx-auto flex size-14 items-center justify-center rounded-2xl bg-starlinks-navySoft text-starlinks-ink"
    >
      <i class="pi pi-clock text-xl" aria-hidden="true"></i>
    </span>
    <h1 class="mt-5 font-display text-2xl font-bold text-starlinks-text">
      {{ 'STARLINKS.ACTIVITY.TITLE' | translate }}
    </h1>
    <p class="mx-auto mt-3 max-w-lg leading-7 text-starlinks-textMuted">
      {{ 'STARLINKS.ACTIVITY.DESCRIPTION' | translate }}
    </p>
  </article>
</section>
