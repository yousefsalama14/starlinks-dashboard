<p-select
  [class.language-switcher--account]="variant() === 'account'"
  [class.language-switcher--default]="variant() === 'default'"
  styleClass="language-switcher__select"
  panelStyleClass="language-switcher__panel"
  [options]="languages"
  optionLabel="labelKey"
  optionValue="code"
  appendTo="body"
  [ariaLabel]="'STARLINKS.LANGUAGES.LABEL' | translate"
  [ngModel]="currentLanguage()"
  (ngModelChange)="setLanguage($event)"
>
  <ng-template #selectedItem let-language>
    <span class="language-switcher__value">
      <iconsax-icon name="global" type="linear" size="16" aria-hidden="true"></iconsax-icon>
      @if (variant() === 'account') {
        <span class="language-switcher__label language-switcher__label--code">
          {{ language.code.toUpperCase() }}
        </span>
      } @else {
        <span class="language-switcher__label">
          {{ language.labelKey | translate }}
        </span>
      }
    </span>
  </ng-template>

  <ng-template #dropdownicon>
    <iconsax-icon
      class="language-switcher__arrow"
      name="arrow-down-01"
      type="linear"
      size="14"
      aria-hidden="true"
    ></iconsax-icon>
  </ng-template>

  <ng-template #item let-language>
    <span class="language-switcher__option">
      <span>{{ language.labelKey | translate }}</span>
      @if (language.code === currentLanguage()) {
        <iconsax-icon
          class="language-switcher__check"
          name="tick-circle"
          type="bold"
          size="18"
          aria-hidden="true"
        ></iconsax-icon>
      }
    </span>
  </ng-template>
</p-select>
