@if (variant() === 'account') {
  <span class="language-switcher language-switcher--account">
    <label class="language-switcher__control language-switcher__control--compact">
      <span class="sr-only">{{ 'STARLINKS.LANGUAGES.LABEL' | translate }}</span>
      <i class="pi pi-globe" aria-hidden="true"></i>
      <select
        [attr.aria-label]="'STARLINKS.LANGUAGES.LABEL' | translate"
        [ngModel]="currentLanguage()"
        (ngModelChange)="setLanguage($event)"
      >
        @for (language of languages; track language.code) {
          <option [value]="language.code">{{ language.code.toUpperCase() }}</option>
        }
      </select>
    </label>

    <label class="language-switcher__control language-switcher__control--full">
      <span class="sr-only">{{ 'STARLINKS.LANGUAGES.LABEL' | translate }}</span>
      <i class="pi pi-globe" aria-hidden="true"></i>
      <select
        [attr.aria-label]="'STARLINKS.LANGUAGES.LABEL' | translate"
        [ngModel]="currentLanguage()"
        (ngModelChange)="setLanguage($event)"
      >
        @for (language of languages; track language.code) {
          <option [value]="language.code">{{ language.labelKey | translate }}</option>
        }
      </select>
    </label>
  </span>
} @else {
  <label class="language-switcher__control language-switcher__control--default">
    <span class="sr-only">{{ 'STARLINKS.LANGUAGES.LABEL' | translate }}</span>
    <i class="pi pi-globe" aria-hidden="true"></i>
    <select
      [attr.aria-label]="'STARLINKS.LANGUAGES.LABEL' | translate"
      [ngModel]="currentLanguage()"
      (ngModelChange)="setLanguage($event)"
    >
      @for (language of languages; track language.code) {
        <option [value]="language.code">{{ language.labelKey | translate }}</option>
      }
    </select>
  </label>
}
